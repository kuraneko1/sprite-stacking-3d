<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Purple Bunny Belly Slide Retro — True-3D Pixel Sprite Stacking</title>
  <style>
    :root {
      --bg-panel: rgba(250, 252, 255, 0.86);
      --border-panel: rgba(124, 58, 237, 0.22);
      --accent: #8b3cf0;
      --accent-dark: #5b21b6;
      --accent-soft: rgba(139, 60, 240, 0.12);
      --text-main: #1e1b4b;
      --text-sub: #4c4a73;
      --ice: #0ea5e9;
      --gold: #d97706;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #e2effc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Noto Sans JP", sans-serif;
      color: var(--text-main);
    }

    #gameCanvas {
      display: block;
      width: 100vw;
      height: 100vh;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      cursor: grab;
      touch-action: none;
    }

    #gameCanvas:active {
      cursor: grabbing;
    }

    /* Top-left HUD badge */
    .hud-top-left {
      position: fixed;
      top: 14px;
      left: 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      pointer-events: none;
      z-index: 10;
    }

    .card {
      background: var(--bg-panel);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1.5px solid var(--border-panel);
      border-radius: 14px;
      box-shadow: 0 8px 24px rgba(59, 28, 122, 0.10);
      pointer-events: auto;
    }

    .title-card {
      padding: 10px 14px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .bunny-badge {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: linear-gradient(135deg, #a855f7, #7e22ce);
      display: grid;
      place-items: center;
      color: #fff;
      font-size: 18px;
      box-shadow: inset 0 2px 4px rgba(255,255,255,0.35);
      flex-shrink: 0;
    }

    .title-text h1 {
      margin: 0;
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 0.01em;
      color: var(--text-main);
    }

    .title-text p {
      margin: 2px 0 0;
      font-size: 11px;
      color: var(--text-sub);
    }

    .stats-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .pill {
      padding: 6px 11px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .pill-star {
      color: var(--gold);
    }

    .pill-surface {
      color: var(--text-sub);
      transition: background 0.2s, color 0.2s, border-color 0.2s;
    }

    .pill-surface.on-ice {
      background: rgba(224, 242, 254, 0.95);
      border-color: rgba(14, 165, 233, 0.45);
      color: #0369a1;
    }

    .pill-speed {
      color: var(--accent-dark);
      font-variant-numeric: tabular-nums;
    }

    /* Top-right controls drawer */
    .hud-top-right {
      position: fixed;
      top: 14px;
      right: 14px;
      width: 268px;
      max-width: calc(100vw - 28px);
      z-index: 20;
    }

    .panel-header {
      padding: 10px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      font-size: 13px;
      font-weight: 800;
      color: var(--text-main);
    }

    .panel-header span.chevron {
      font-size: 11px;
      color: var(--accent);
      transition: transform 0.2s;
    }

    .hud-top-right.collapsed .panel-body {
      display: none;
    }

    .hud-top-right.collapsed .panel-header span.chevron {
      transform: rotate(-90deg);
    }

    .panel-body {
      padding: 10px 14px 14px;
      display: flex;
      flex-direction: column;
      gap: 11px;
      border-top: 1px solid rgba(124, 58, 237, 0.12);
      max-height: calc(100vh - 150px);
      overflow-y: auto;
    }

    .mode-switch {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      background: var(--accent-soft);
      padding: 4px;
      border-radius: 10px;
    }

    .mode-btn {
      border: none;
      background: transparent;
      padding: 7px 6px;
      border-radius: 7px;
      font-size: 11.5px;
      font-weight: 700;
      color: var(--text-sub);
      cursor: pointer;
      transition: all 0.15s;
    }

    .mode-btn.active {
      background: var(--accent);
      color: #fff;
      box-shadow: 0 2px 8px rgba(139, 60, 240, 0.35);
    }

    .slider-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .slider-label {
      display: flex;
      justify-content: space-between;
      font-size: 11.5px;
      font-weight: 700;
      color: var(--text-sub);
    }

    .slider-label output {
      color: var(--accent-dark);
      font-variant-numeric: tabular-nums;
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--accent);
      height: 5px;
      cursor: pointer;
    }

    .toggles-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }

    .toggle-btn {
      border: 1.5px solid rgba(124, 58, 237, 0.22);
      background: rgba(255, 255, 255, 0.7);
      border-radius: 9px;
      padding: 6px 8px;
      font-size: 11.5px;
      font-weight: 700;
      color: var(--text-sub);
      cursor: pointer;
      transition: all 0.15s;
    }

    .toggle-btn.active {
      background: var(--accent-soft);
      border-color: var(--accent);
      color: var(--accent-dark);
    }

    .preset-row {
      display: flex;
      gap: 6px;
    }

    .mini-btn {
      flex: 1;
      border: 1px solid rgba(124, 58, 237, 0.22);
      background: #fff;
      border-radius: 8px;
      padding: 5px 6px;
      font-size: 11px;
      font-weight: 700;
      color: var(--text-sub);
      cursor: pointer;
    }

    .mini-btn:hover {
      border-color: var(--accent);
      color: var(--accent-dark);
    }

    /* Sheet inspector preview modal inside panel */
    .sheet-preview {
      display: none;
      flex-direction: column;
      gap: 6px;
      background: rgba(241, 245, 255, 0.9);
      border-radius: 10px;
      padding: 8px;
      border: 1px solid rgba(124, 58, 237, 0.16);
    }

    .sheet-preview.open {
      display: flex;
    }

    .sheet-preview span {
      font-size: 10.5px;
      font-weight: 700;
      color: var(--text-sub);
    }

    .sheet-preview img {
      width: 100%;
      border-radius: 6px;
      image-rendering: pixelated;
      border: 1px solid rgba(0, 0, 0, 0.08);
      background: #fff;
    }

    .sheet-preview .slice-strip-wrap {
      overflow-x: auto;
      background: repeating-conic-gradient(#e5e7eb 0% 25%, #fff 0% 50%) 50% / 10px 10px;
      border-radius: 6px;
      padding: 4px;
    }

    .sheet-preview .slice-strip-wrap img {
      width: auto;
      height: 42px;
      background: transparent;
      border: none;
    }

    /* Bottom controls hint */
    .hud-bottom {
      position: fixed;
      bottom: 14px;
      left: 50%;
      transform: translateX(-50%);
      padding: 8px 14px;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-sub);
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
      max-width: calc(100vw - 28px);
      z-index: 10;
    }

    kbd {
      display: inline-block;
      padding: 2px 6px;
      font-size: 11px;
      font-weight: 800;
      color: var(--accent-dark);
      background: #fff;
      border: 1px solid rgba(124, 58, 237, 0.3);
      border-bottom-width: 2px;
      border-radius: 5px;
      font-family: inherit;
    }

    .boost-mobile-btn {
      position: fixed;
      right: 16px;
      bottom: 62px;
      width: 60px;
      height: 60px;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.85);
      background: linear-gradient(135deg, #a855f7, #7e22ce);
      color: #fff;
      font-size: 11px;
      font-weight: 800;
      box-shadow: 0 6px 18px rgba(126, 34, 206, 0.35);
      cursor: pointer;
      z-index: 15;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      line-height: 1.15;
    }

    .boost-mobile-btn:active {
      transform: scale(0.93);
    }

    @media (max-width: 640px) {
      .hud-bottom { display: none; }
      .hud-top-right { width: 224px; }
    }
  </style>
</head>
<body>
  <canvas id="gameCanvas"></canvas>

  <!-- Top-left HUD -->
  <div class="hud-top-left">
    <div class="card title-card">
      <div class="bunny-badge">🐇</div>
      <div class="title-text">
        <h1>Purple Bunny Belly Slide <span style='font-size:11px;color:#8b3cf0;font-weight:900'>Retro v2</span></h1>
        <p>レトロドット絵 3D ボクセル・スプライトスタッキング（28層・高速化済）</p>
      </div>
    </div>
    <div class="stats-row">
      <div class="card pill pill-star">★ <span id="starCount">0</span></div>
      <div class="card pill pill-surface" id="surfaceBadge">❄ SNOW</div>
      <div class="card pill pill-speed"><span id="speedReadout">0</span> px/s</div>
    </div>
  </div>

  <!-- Top-right Inspector / Settings Panel -->
  <div class="card hud-top-right" id="controlPanel">
    <div class="panel-header" id="panelToggle">
      <span>⚙ 3D スタック設定</span>
      <span class="chevron">▼</span>
    </div>
    <div class="panel-body">
      <div class="mode-switch">
        <button class="mode-btn active" id="modePlayBtn">フリー滑走</button>
        <button class="mode-btn" id="modeInspectBtn">360° 観察</button>
      </div>

      <div class="slider-group">
        <div class="slider-label">
          <span>カメラ仰角 (Squash)</span>
          <output id="squashVal">0.72</output>
        </div>
        <input type="range" id="squashSlider" min="0.45" max="1.00" step="0.01" value="0.72" />
      </div>

      <div class="slider-group">
        <div class="slider-label">
          <span>スライス間隔 (Spacing)</span>
          <output id="spacingVal">1.00</output>
        </div>
        <input type="range" id="spacingSlider" min="0.00" max="3.00" step="0.05" value="1.00" />
      </div>

      <div class="slider-group">
        <div class="slider-label">
          <span>表示拡大率 (Zoom)</span>
          <output id="zoomVal">3x</output>
        </div>
        <input type="range" id="zoomSlider" min="2" max="6" step="1" value="3" />
      </div>

      <div class="toggles-row">
        <button class="toggle-btn active" id="outlineToggle">輪郭線: ON</button>
        <button class="toggle-btn active" id="sfxToggle">効果音: ON</button>
      </div>

      <div class="preset-row">
        <button class="mini-btn" id="btnSpread">層を展開 (2.5)</button>
        <button class="mini-btn" id="btnResetView">標準に戻す</button>
      </div>

      <button class="toggle-btn" id="sheetToggle">🖼 4面図 & スライスを見る</button>

      <div class="sheet-preview" id="sheetPreview">
        <span>Nano Banana 生成 4面図 (2×2 正射影)</span>
        <img id="imgViews" alt="4-view sheet" />
        <span>3D ボクセル・スライスシート (28層・Retro)</span>
        <div class="slice-strip-wrap">
          <img id="imgSlices" alt="30 horizontal slices" />
        </div>
      </div>
    </div>
  </div>

  <!-- Quick Boost button -->
  <button class="boost-mobile-btn" id="boostBtn" title="ブースト (Space / Shift)">
    <span>⚡</span>
    <span>BOOST</span>
  </button>

  <!-- Bottom Controls Bar -->
  <div class="card hud-bottom">
    <span><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> / <kbd>↑↓←→</kbd> / ドラッグで滑走</span>
    <span><kbd>Space</kbd> / <kbd>Shift</kbd> ブースト</span>
    <span><kbd>Q</kbd><kbd>E</kbd> カメラ回転</span>
    <span><kbd>R</kbd> カメラ正面リセット</span>
  </div>

  <script>
(() => {
  "use strict";

  // ---------------------------------------------------------------------------
  // Canvas & Low-Res Pixel-Perfect Scene Buffer Setup
  // ---------------------------------------------------------------------------
  const displayCanvas = document.getElementById("gameCanvas");
  const dctx = displayCanvas.getContext("2d", { alpha: false });

  const sceneCanvas = document.createElement("canvas");
  const sctx = sceneCanvas.getContext("2d", { alpha: false });

  // Reusable scratch buffers resized tightly per object (avoids clearing giant empty regions!)
  const stackBuf = document.createElement("canvas");
  const stackCtx = stackBuf.getContext("2d");
  const tintBuf = document.createElement("canvas");
  const tintCtx = tintBuf.getContext("2d");

  // ---------------------------------------------------------------------------
  // State & Settings
  // ---------------------------------------------------------------------------
  const settings = {
    mode: "play",         // "play" | "inspect"
    squash: 0.72,         // Slightly gentler top-down angle so 3D faces & silhouettes shine!
    spacing: 1.0,         // Screen art-px lift per slice
    zoom: 3,              // Display pixel scale (2x..6x Retro)
    outline: true,        // Crisp 1px post-stack outline
    sfx: true,
  };

  let sceneW = 640;
  let sceneH = 380;

  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const cssW = window.innerWidth;
    const cssH = window.innerHeight;
    displayCanvas.width = Math.max(1, Math.floor(cssW * dpr));
    displayCanvas.height = Math.max(1, Math.floor(cssH * dpr));

    const effScale = Math.max(1, settings.zoom * (dpr > 1.3 ? 1.5 : 1));
    sceneW = Math.max(240, Math.ceil(displayCanvas.width / effScale));
    sceneH = Math.max(160, Math.ceil(displayCanvas.height / effScale));
    sceneCanvas.width = sceneW;
    sceneCanvas.height = sceneH;
    sctx.imageSmoothingEnabled = false;
    dctx.imageSmoothingEnabled = false;
  }

  // ---------------------------------------------------------------------------
  // Web Audio Cozy Synth SFX
  // ---------------------------------------------------------------------------
  let audioCtx = null;
  function ensureAudio() {
    if (!settings.sfx) return null;
    if (!audioCtx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) audioCtx = new AC();
    }
    if (audioCtx && audioCtx.state === "suspended") {
      audioCtx.resume().catch(() => {});
    }
    return audioCtx;
  }

  function playBoostSfx() {
    const ac = ensureAudio();
    if (!ac) return;
    const t = ac.currentTime;
    const osc = ac.createOscillator();
    const gain = ac.createGain();
    osc.type = "triangle";
    osc.frequency.setValueAtTime(240, t);
    osc.frequency.exponentialRampToValueAtTime(580, t + 0.14);
    gain.gain.setValueAtTime(0.001, t);
    gain.gain.linearRampToValueAtTime(0.11, t + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.001, t + 0.18);
    osc.connect(gain).connect(ac.destination);
    osc.start(t);
    osc.stop(t + 0.2);
  }

  function playStarSfx(comboCount) {
    const ac = ensureAudio();
    if (!ac) return;
    const notes = [523.25, 587.33, 659.25, 783.99, 880.0, 1046.5];
    const base = notes[comboCount % notes.length];
    const t = ac.currentTime;
    [base, base * 1.5].forEach((freq, idx) => {
      const osc = ac.createOscillator();
      const gain = ac.createGain();
      osc.type = "sine";
      osc.frequency.setValueAtTime(freq, t + idx * 0.055);
      gain.gain.setValueAtTime(0.001, t + idx * 0.055);
      gain.gain.linearRampToValueAtTime(0.10, t + idx * 0.055 + 0.015);
      gain.gain.exponentialRampToValueAtTime(0.001, t + idx * 0.055 + 0.22);
      osc.connect(gain).connect(ac.destination);
      osc.start(t + idx * 0.055);
      osc.stop(t + idx * 0.055 + 0.25);
    });
  }

  function playBumpSfx() {
    const ac = ensureAudio();
    if (!ac) return;
    const t = ac.currentTime;
    const osc = ac.createOscillator();
    const gain = ac.createGain();
    osc.type = "sine";
    osc.frequency.setValueAtTime(175, t);
    osc.frequency.exponentialRampToValueAtTime(90, t + 0.11);
    gain.gain.setValueAtTime(0.11, t);
    gain.gain.exponentialRampToValueAtTime(0.001, t + 0.12);
    osc.connect(gain).connect(ac.destination);
    osc.start(t);
    osc.stop(t + 0.14);
  }

  // ---------------------------------------------------------------------------
  // Asset Loading + Ice-Patch Surface Detection
  // ---------------------------------------------------------------------------
  const imgs = {};
  let groundPattern = null;
  let iceMask = null;
  let iceW = 128;
  let iceH = 128;

  function loadAssets() {
    const keys = Object.keys(window.SPRITE_ASSETS);
    return Promise.all(
      keys.map(
        (key) =>
          new Promise((resolve, reject) => {
            const img = new Image();
            img.onload = () => {
              imgs[key] = img;
              resolve();
            };
            img.onerror = reject;
            img.src = window.SPRITE_ASSETS[key];
          })
      )
    ).then(() => {
      const gt = imgs.groundTile;
      iceW = gt.width;
      iceH = gt.height;
      const tmp = document.createElement("canvas");
      tmp.width = iceW;
      tmp.height = iceH;
      const tctx = tmp.getContext("2d");
      tctx.drawImage(gt, 0, 0);
      const data = tctx.getImageData(0, 0, iceW, iceH).data;
      iceMask = new Uint8Array(iceW * iceH);
      for (let i = 0; i < iceW * iceH; i++) {
        const r = data[i * 4];
        const b = data[i * 4 + 2];
        iceMask[i] = (r < 224 && b >= 240) ? 1 : 0;
      }
      groundPattern = sctx.createPattern(gt, "repeat");

      document.getElementById("imgViews").src = window.SPRITE_ASSETS.bunnyViews;
      document.getElementById("imgSlices").src = window.SPRITE_ASSETS.bunnySlices;
    });
  }

  function isWorldOnIce(wx, wy) {
    if (!iceMask) return false;
    const tx = ((Math.floor(wx) % iceW) + iceW) % iceW;
    const ty = ((Math.floor(wy) % iceH) + iceH) % iceH;
    return iceMask[ty * iceW + tx] === 1;
  }

  // ---------------------------------------------------------------------------
  // Fast Tight-Bounds Sprite-Stack Baker & Quantized Angle Cache
  // Eliminates redundant per-frame slice blits & giant full-buffer clears!
  // ---------------------------------------------------------------------------
  const bakedCache = new Map();
  let cacheSignature = "";

  function checkCacheValidity() {
    const sig = `${settings.squash.toFixed(2)}_${settings.spacing.toFixed(2)}_${settings.outline ? 1 : 0}`;
    if (sig !== cacheSignature) {
      bakedCache.clear();
      cacheSignature = sig;
    }
  }

  function bakeStackSprite(sheet, count, turnRad, squash, spacing, outlineColor) {
    const sw = sheet.width / count;
    const sh = sheet.height;
    const diag = Math.ceil(Math.hypot(sw, sh));
    const liftH = Math.ceil(count * spacing);
    const pad = 6;

    const bw = diag + pad * 2;
    const bh = Math.ceil(diag * squash) + liftH + pad * 2;
    const cx = Math.floor(bw / 2);
    const cy = bh - Math.ceil(diag * squash * 0.5) - pad;

    if (stackBuf.width < bw || stackBuf.height < bh) {
      stackBuf.width = Math.max(stackBuf.width, bw);
      stackBuf.height = Math.max(stackBuf.height, bh);
      tintBuf.width = stackBuf.width;
      tintBuf.height = stackBuf.height;
    }

    stackCtx.clearRect(0, 0, bw, bh);
    stackCtx.imageSmoothingEnabled = false;

    const ox = -Math.floor(sw / 2);
    const oy = -Math.floor(sh / 2);

    // Draw slices ground -> top (exact SpriteCook transform order)
    for (let z = 0; z < count; z++) {
      stackCtx.save();
      stackCtx.translate(cx, cy - Math.round(z * spacing));
      stackCtx.scale(1, squash);
      stackCtx.rotate(turnRad);
      stackCtx.drawImage(sheet, z * sw, 0, sw, sh, ox, oy, sw, sh);
      stackCtx.restore();
    }

    const out = document.createElement("canvas");
    out.width = bw;
    out.height = bh;
    const octx = out.getContext("2d");
    octx.imageSmoothingEnabled = false;

    if (settings.outline && outlineColor) {
      tintCtx.clearRect(0, 0, bw, bh);
      tintCtx.imageSmoothingEnabled = false;
      tintCtx.globalCompositeOperation = "source-over";
      tintCtx.drawImage(stackBuf, 0, 0, bw, bh, 0, 0, bw, bh);
      tintCtx.globalCompositeOperation = "source-in";
      tintCtx.fillStyle = outlineColor;
      tintCtx.fillRect(0, 0, bw, bh);
      tintCtx.globalCompositeOperation = "source-over";

      octx.drawImage(tintBuf, 0, 0, bw, bh, -1, 0, bw, bh);
      octx.drawImage(tintBuf, 0, 0, bw, bh, 1, 0, bw, bh);
      octx.drawImage(tintBuf, 0, 0, bw, bh, 0, -1, bw, bh);
      octx.drawImage(tintBuf, 0, 0, bw, bh, 0, 1, bw, bh);
    }
    octx.drawImage(stackBuf, 0, 0, bw, bh, 0, 0, bw, bh);

    return { canvas: out, cx, cy };
  }

  function getCachedStack(type, sheet, count, turnRad, steps, outlineColor, spacingOverride = null) {
    checkCacheValidity();
    const TWO_PI = Math.PI * 2;
    const norm = ((turnRad % TWO_PI) + TWO_PI) % TWO_PI;
    const bucket = Math.round((norm / TWO_PI) * steps) % steps;
    const sp = spacingOverride !== null ? spacingOverride : settings.spacing;
    const key = `${type}_${bucket}_${sp.toFixed(2)}`;

    let entry = bakedCache.get(key);
    if (entry) return entry;

    const snappedRad = (bucket / steps) * TWO_PI;
    entry = bakeStackSprite(sheet, count, snappedRad, settings.squash, sp, outlineColor);

    if (bakedCache.size > 260) {
      // Drop oldest entries cleanly
      const firstKey = bakedCache.keys().next().value;
      bakedCache.delete(firstKey);
    }
    bakedCache.set(key, entry);
    return entry;
  }

  // ---------------------------------------------------------------------------
  // World Generation (Cozy Snowy Ice Park)
  // ---------------------------------------------------------------------------
  const WORLD_RADIUS = 440;
  const props = [];
  const stars = [];
  const trails = [];
  const particles = [];

  function mulberry32(seed) {
    let a = seed >>> 0;
    return () => {
      a |= 0;
      a = (a + 0x6d2b79f5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function buildWorld() {
    props.length = 0;
    stars.length = 0;
    const rng = mulberry32(20261120);

    // Outer snowy pine border ring
    const ringCount = 34;
    for (let i = 0; i < ringCount; i++) {
      const a = (i / ringCount) * Math.PI * 2 + (rng() - 0.5) * 0.08;
      const r = WORLD_RADIUS + 18 + rng() * 34;
      props.push({
        type: "tree",
        x: Math.cos(a) * r,
        y: Math.sin(a) * r,
        angle: rng() * Math.PI * 2,
        radius: 13,
        shake: 0,
        spinVel: 0,
      });
    }

    // Interior snowy pine clusters
    const treeSpots = [
      [-150, -120], [-185, -90], [-145, -165],
      [165, -135], [205, -105],
      [-210, 120], [-170, 160],
      [175, 130], [215, 165], [140, 185],
      [0, -255], [40, -275],
      [-40, 260], [20, 285],
      [-305, -15], [310, 15],
      [-285, -245], [275, -230], [-270, 245], [285, 255],
    ];
    for (const [tx, ty] of treeSpots) {
      props.push({
        type: "tree",
        x: tx + (rng() - 0.5) * 16,
        y: ty + (rng() - 0.5) * 16,
        angle: rng() * Math.PI * 2,
        radius: 21,
        shake: 0,
        spinVel: 0,
      });
    }

    // Cheerful Snowmen
    const snowmanSpots = [
      [-95, -70, 0.7],
      [110, -55, 2.3],
      [-115, 95, -0.6],
      [95, 110, -2.2],
      [255, -15, Math.PI],
      [-245, 20, 0.0],
      [15, -185, 1.55],
      [-15, 195, -1.55],
    ];
    for (const [sx, sy, ang] of snowmanSpots) {
      props.push({
        type: "snowman",
        x: sx,
        y: sy,
        angle: ang,
        radius: 10,
        shake: 0,
        spinVel: 0,
      });
    }

    // Floating spinning 3D Golden Stars
    for (let i = 0; i < 14; i++) {
      const a = (i / 14) * Math.PI * 2;
      const dist = i % 2 === 0 ? 115 : 235;
      stars.push({
        x: Math.cos(a) * dist,
        y: Math.sin(a) * dist,
        phase: rng() * Math.PI * 2,
        collected: false,
        respawnTimer: 0,
      });
    }
  }

  // ---------------------------------------------------------------------------
  // Player (Belly-Sliding Purple Bunny!)
  // ---------------------------------------------------------------------------
  const bunny = {
    x: 0,
    y: 0,
    vx: 38,
    vy: 26,
    heading: Math.atan2(26, 38),
    boostTimer: 0,
    boostCooldown: 0,
    wobblePhase: 0,
    hopZ: 0,
    hopVz: 0,
    onIce: false,
    starsCollected: 0,
  };

  const cam = {
    x: 0,
    y: 0,
    angle: 0,
    inspectAngle: Math.PI * 0.32,
  };

  // ---------------------------------------------------------------------------
  // Input Handling
  // ---------------------------------------------------------------------------
  const keys = new Set();
  const pointer = { active: false, x: 0, y: 0, lastX: 0 };

  window.addEventListener("keydown", (e) => {
    const code = e.code;
    if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", "Space"].includes(code)) {
      e.preventDefault();
    }
    if ((code === "Space" || code === "ShiftLeft" || code === "ShiftRight") && !keys.has(code)) {
      triggerBoost();
    }
    if (code === "KeyR") cam.angle = 0;
    keys.add(code);
  });

  window.addEventListener("keyup", (e) => keys.delete(e.code));
  window.addEventListener("blur", () => {
    keys.clear();
    pointer.active = false;
  });

  displayCanvas.addEventListener("pointerdown", (e) => {
    ensureAudio();
    pointer.active = true;
    pointer.x = e.clientX;
    pointer.y = e.clientY;
    pointer.lastX = e.clientX;
    displayCanvas.setPointerCapture(e.pointerId);
  });

  displayCanvas.addEventListener("pointermove", (e) => {
    if (!pointer.active) return;
    if (settings.mode === "inspect") {
      cam.inspectAngle += (e.clientX - pointer.lastX) * 0.014;
    }
    pointer.x = e.clientX;
    pointer.y = e.clientY;
    pointer.lastX = e.clientX;
  });

  displayCanvas.addEventListener("pointerup", () => { pointer.active = false; });
  displayCanvas.addEventListener("pointercancel", () => { pointer.active = false; });

  function triggerBoost() {
    ensureAudio();
    if (settings.mode === "inspect") {
      bunny.hopVz = 38;
      playBoostSfx();
      spawnBurst(bunny.x, bunny.y, 10, "#e9d5ff", 80);
      return;
    }
    if (bunny.boostCooldown > 0) return;
    bunny.boostCooldown = 0.52;
    bunny.boostTimer = 0.34;
    bunny.hopVz = 62;

    const dir = getDesiredWorldInput();
    const boostAng = dir.mag > 0.1 ? Math.atan2(dir.wy, dir.wx) : bunny.heading;
    bunny.heading = boostAng;
    bunny.vx += Math.cos(boostAng) * 115;
    bunny.vy += Math.sin(boostAng) * 115;

    playBoostSfx();
    spawnBurst(
      bunny.x - Math.cos(boostAng) * 14,
      bunny.y - Math.sin(boostAng) * 14,
      10,
      bunny.onIce ? "#7dd3fc" : "#ffffff",
      95
    );
  }

  function getDesiredWorldInput() {
    let sx = 0, sy = 0;
    if (keys.has("KeyW") || keys.has("ArrowUp")) sy -= 1;
    if (keys.has("KeyS") || keys.has("ArrowDown")) sy += 1;
    if (keys.has("KeyA") || keys.has("ArrowLeft")) sx -= 1;
    if (keys.has("KeyD") || keys.has("ArrowRight")) sx += 1;

    if (sx === 0 && sy === 0 && pointer.active && settings.mode === "play") {
      const dx = pointer.x - window.innerWidth * 0.5;
      const dy = (pointer.y - window.innerHeight * 0.5) / Math.max(0.35, settings.squash);
      const dist = Math.hypot(dx, dy);
      if (dist > 18) {
        sx = dx / dist;
        sy = dy / dist;
      }
    }

    const mag = Math.hypot(sx, sy);
    if (mag < 1e-4) return { wx: 0, wy: 0, mag: 0 };
    const nx = sx / mag;
    const ny = sy / mag;
    const c = Math.cos(-cam.angle);
    const s = Math.sin(-cam.angle);
    return { wx: nx * c - ny * s, wy: nx * s + ny * c, mag: Math.min(1, mag) };
  }

  function spawnBurst(wx, wy, count, color, speedMax, zStart = 5) {
    for (let i = 0; i < count; i++) {
      const a = Math.random() * Math.PI * 2;
      const spd = (0.3 + Math.random() * 0.7) * speedMax;
      particles.push({
        x: wx + (Math.random() - 0.5) * 12,
        y: wy + (Math.random() - 0.5) * 12,
        z: zStart + Math.random() * 8,
        vx: Math.cos(a) * spd,
        vy: Math.sin(a) * spd,
        vz: 28 + Math.random() * 48,
        life: 0.35 + Math.random() * 0.3,
        maxLife: 0.65,
        size: Math.random() < 0.4 ? 3 : 2,
        color,
      });
    }
  }

  function shortestAngleDiff(from, to) {
    let d = ((to - from + Math.PI) % (Math.PI * 2)) - Math.PI;
    if (d < -Math.PI) d += Math.PI * 2;
    return d;
  }

  // ---------------------------------------------------------------------------
  // Physics & World Update
  // ---------------------------------------------------------------------------
  let trailAccum = 0;
  let particleAccum = 0;
  let elapsed = 0;

  function update(dt) {
    elapsed += dt;

    if (keys.has("KeyQ")) cam.angle += 1.9 * dt;
    if (keys.has("KeyE")) cam.angle -= 1.9 * dt;

    if (bunny.hopZ > 0 || bunny.hopVz !== 0) {
      bunny.hopZ += bunny.hopVz * dt;
      bunny.hopVz -= 210 * dt;
      if (bunny.hopZ <= 0) {
        bunny.hopZ = 0;
        bunny.hopVz = 0;
      }
    }

    if (settings.mode === "inspect") {
      bunny.vx = 0;
      bunny.vy = 0;
      let spinRate = pointer.active ? 0 : 0.82;
      if (keys.has("KeyA") || keys.has("ArrowLeft")) spinRate = -2.2;
      if (keys.has("KeyD") || keys.has("ArrowRight")) spinRate = 2.2;
      cam.inspectAngle += spinRate * dt;
      bunny.heading = cam.inspectAngle;
      bunny.wobblePhase += dt * 4.2;

      cam.x += (bunny.x - cam.x) * Math.min(1, dt * 10);
      cam.y += (bunny.y - cam.y) * Math.min(1, dt * 10);
    } else {
      bunny.boostCooldown = Math.max(0, bunny.boostCooldown - dt);
      bunny.boostTimer = Math.max(0, bunny.boostTimer - dt);

      bunny.onIce = isWorldOnIce(bunny.x, bunny.y);
      const input = getDesiredWorldInput();

      const accel = bunny.onIce ? 375 : 340;
      const damp = bunny.onIce ? 1.05 : 2.55;
      const maxSpd = (bunny.onIce ? 175 : 132) + (bunny.boostTimer > 0 ? 80 : 0);

      if (input.mag > 0.05) {
        bunny.vx += input.wx * accel * dt;
        bunny.vy += input.wy * accel * dt;
      }

      const factor = Math.exp(-damp * dt);
      bunny.vx *= factor;
      bunny.vy *= factor;

      let speed = Math.hypot(bunny.vx, bunny.vy);
      if (speed > maxSpd) {
        const s = maxSpd / speed;
        bunny.vx *= s;
        bunny.vy *= s;
        speed = maxSpd;
      }
      if (speed < 1.5 && input.mag < 0.05) {
        bunny.vx = 0;
        bunny.vy = 0;
        speed = 0;
      }

      bunny.x += bunny.vx * dt;
      bunny.y += bunny.vy * dt;

      if (speed > 6) {
        const velAng = Math.atan2(bunny.vy, bunny.vx);
        const diff = shortestAngleDiff(bunny.heading, velAng);
        bunny.heading += diff * Math.min(1, dt * (bunny.onIce ? 8.5 : 12.5));
        bunny.wobblePhase += dt * (4.5 + speed * 0.042);
      } else {
        bunny.wobblePhase += dt * 2.2;
      }

      // Soft snowy arena boundary
      const distFromCenter = Math.hypot(bunny.x, bunny.y);
      if (distFromCenter > WORLD_RADIUS) {
        const nx = bunny.x / distFromCenter;
        const ny = bunny.y / distFromCenter;
        bunny.x = nx * WORLD_RADIUS;
        bunny.y = ny * WORLD_RADIUS;
        const vn = bunny.vx * nx + bunny.vy * ny;
        if (vn > 0) {
          bunny.vx -= 1.65 * vn * nx;
          bunny.vy -= 1.65 * vn * ny;
          playBumpSfx();
          spawnBurst(bunny.x, bunny.y, 7, "#ffffff", 60);
        }
      }

      // Soft bouncy collisions with trees & snowmen
      const bunnyR = 12;
      for (let i = 0; i < props.length; i++) {
        const p = props[i];
        const dx = bunny.x - p.x;
        const dy = bunny.y - p.y;
        const minDist = bunnyR + p.radius;
        if (Math.abs(dx) > minDist || Math.abs(dy) > minDist) continue;
        const d = Math.hypot(dx, dy);
        if (d < minDist && d > 0.001) {
          const nx = dx / d;
          const ny = dy / d;
          bunny.x = p.x + nx * minDist;
          bunny.y = p.y + ny * minDist;
          const vn = bunny.vx * nx + bunny.vy * ny;
          if (vn < 0) {
            bunny.vx -= 1.75 * vn * nx;
            bunny.vy -= 1.75 * vn * ny;
            p.shake = 1.0;
            if (p.type === "snowman") {
              p.spinVel += (Math.random() < 0.5 ? -1 : 1) * 7.5;
            }
            if (Math.abs(vn) > 38) {
              playBumpSfx();
              spawnBurst(p.x, p.y, 8, p.type === "tree" ? "#e0f2fe" : "#ffffff", 75, 22);
            }
          }
        }
      }

      // Star collectibles
      for (let i = 0; i < stars.length; i++) {
        const st = stars[i];
        if (st.collected) {
          st.respawnTimer -= dt;
          if (st.respawnTimer <= 0) {
            st.collected = false;
            spawnBurst(st.x, st.y, 6, "#fde68a", 45, 14);
          }
          continue;
        }
        if (Math.hypot(bunny.x - st.x, bunny.y - st.y) < 21) {
          st.collected = true;
          st.respawnTimer = 6.0;
          bunny.starsCollected++;
          playStarSfx(bunny.starsCollected);
          spawnBurst(st.x, st.y, 12, "#facc15", 95, 16);
          spawnBurst(st.x, st.y, 6, "#ffffff", 65, 16);
        }
      }

      // Trails & spray particles (lightweight & crisp)
      if (speed > 16) {
        trailAccum += speed * dt;
        if (trailAccum > 6.5) {
          trailAccum = 0;
          trails.push({
            x: bunny.x - Math.cos(bunny.heading) * 6,
            y: bunny.y - Math.sin(bunny.heading) * 6,
            onIce: bunny.onIce,
            age: 0,
            maxAge: 4.5,
          });
          if (trails.length > 130) trails.shift();
        }

        particleAccum += speed * dt;
        const thresh = bunny.boostTimer > 0 ? 9 : 26;
        if (particleAccum > thresh) {
          particleAccum = 0;
          const sideSign = Math.random() < 0.5 ? -1 : 1;
          const perp = bunny.heading + sideSign * (Math.PI * 0.5);
          particles.push({
            x: bunny.x - Math.cos(bunny.heading) * 8 + Math.cos(perp) * 6,
            y: bunny.y - Math.sin(bunny.heading) * 8 + Math.sin(perp) * 6,
            z: 3,
            vx: -bunny.vx * 0.18 + Math.cos(perp) * (22 + Math.random() * 26),
            vy: -bunny.vy * 0.18 + Math.sin(perp) * (22 + Math.random() * 26),
            vz: 22 + Math.random() * 30,
            life: 0.3 + Math.random() * 0.22,
            maxLife: 0.52,
            size: bunny.boostTimer > 0 ? 3 : 2,
            color: bunny.onIce ? "#7dd3fc" : (bunny.boostTimer > 0 ? "#f3e8ff" : "#ffffff"),
          });
        }
      }

      const lookX = bunny.x + bunny.vx * 0.22;
      const lookY = bunny.y + bunny.vy * 0.22;
      cam.x += (lookX - cam.x) * Math.min(1, dt * 6.5);
      cam.y += (lookY - cam.y) * Math.min(1, dt * 6.5);
    }

    for (let i = 0; i < props.length; i++) {
      const p = props[i];
      if (p.shake > 0) p.shake = Math.max(0, p.shake - dt * 3.5);
      if (Math.abs(p.spinVel) > 0.01) {
        p.angle += p.spinVel * dt;
        p.spinVel *= Math.exp(-3.2 * dt);
      }
    }

    for (let i = trails.length - 1; i >= 0; i--) {
      trails[i].age += dt;
      if (trails[i].age >= trails[i].maxAge) trails.splice(i, 1);
    }

    for (let i = particles.length - 1; i >= 0; i--) {
      const pt = particles[i];
      pt.life -= dt;
      if (pt.life <= 0) {
        particles.splice(i, 1);
        continue;
      }
      pt.x += pt.vx * dt;
      pt.y += pt.vy * dt;
      pt.z = Math.max(0, pt.z + pt.vz * dt);
      pt.vz -= 140 * dt;
      pt.vx *= Math.exp(-2.5 * dt);
      pt.vy *= Math.exp(-2.5 * dt);
    }
  }

  // ---------------------------------------------------------------------------
  // Coordinate Projection & Fast Rendering
  // ---------------------------------------------------------------------------
  function getScreenCenterY() {
    const inspectShift = settings.mode === "inspect" ? Math.round(13 * settings.spacing) : 0;
    return Math.round(sceneH * 0.5) + inspectShift;
  }

  function render() {
    sctx.imageSmoothingEnabled = false;
    sctx.fillStyle = "#e2effc";
    sctx.fillRect(0, 0, sceneW, sceneH);

    const scx = Math.round(sceneW * 0.5);
    const scy = getScreenCenterY();
    const cosA = Math.cos(cam.angle);
    const sinA = Math.sin(cam.angle);
    const sq = settings.squash;

    // 1. Ground plane (Nano Banana seamless HD snow-and-ice tile + batched belly trails)
    const halfDiag = Math.ceil(Math.hypot(sceneW, sceneH / Math.max(0.35, sq))) + 110;
    sctx.save();
    sctx.translate(scx, scy);
    sctx.scale(1, sq);
    sctx.rotate(cam.angle);
    sctx.translate(-Math.round(cam.x), -Math.round(cam.y));

    if (groundPattern) {
      sctx.fillStyle = groundPattern;
      sctx.fillRect(Math.round(cam.x) - halfDiag, Math.round(cam.y) - halfDiag, halfDiag * 2, halfDiag * 2);
    }

    // Gentle rink guide rings
    sctx.strokeStyle = "rgba(147, 59, 240, 0.10)";
    sctx.lineWidth = 3;
    sctx.beginPath();
    sctx.arc(0, 0, 115, 0, Math.PI * 2);
    sctx.stroke();

    sctx.strokeStyle = "rgba(56, 189, 248, 0.16)";
    sctx.setLineDash([10, 10]);
    sctx.beginPath();
    sctx.arc(0, 0, 235, 0, Math.PI * 2);
    sctx.stroke();
    sctx.setLineDash([]);

    // Lightweight trail stamps (no per-stamp save/rotate/restore!)
    for (let i = 0; i < trails.length; i++) {
      const tr = trails[i];
      const a = 1 - tr.age / tr.maxAge;
      const tx = Math.round(tr.x);
      const ty = Math.round(tr.y);
      if (tr.onIce) {
        sctx.fillStyle = `rgba(255, 255, 255, ${(a * 0.58).toFixed(2)})`;
        sctx.fillRect(tx - 4, ty - 4, 8, 8);
      } else {
        sctx.fillStyle = `rgba(176, 198, 232, ${(a * 0.50).toFixed(2)})`;
        sctx.fillRect(tx - 5, ty - 5, 10, 10);
        sctx.fillStyle = `rgba(225, 210, 252, ${(a * 0.30).toFixed(2)})`;
        sctx.fillRect(tx - 3, ty - 3, 6, 6);
      }
    }
    sctx.restore();

    // 2. Collect visible 3D objects & Y-sort by camera-space ground depth
    const drawList = [];
    const cullX = 110;
    const cullY = 140;

    for (let i = 0; i < props.length; i++) {
      const p = props[i];
      const dx = p.x - cam.x;
      const dy = p.y - cam.y;
      const rx = dx * cosA - dy * sinA;
      const ry = dx * sinA + dy * cosA;
      const sx = Math.round(scx + rx);
      const sy = Math.round(scy + ry * sq);
      if (sx < -cullX || sx > sceneW + cullX || sy < -cullY || sy > sceneH + cullY + 60) continue;
      drawList.push({ kind: p.type, obj: p, sx, sy, depth: ry });
    }

    for (let i = 0; i < stars.length; i++) {
      const st = stars[i];
      if (st.collected) continue;
      const dx = st.x - cam.x;
      const dy = st.y - cam.y;
      const rx = dx * cosA - dy * sinA;
      const ry = dx * sinA + dy * cosA;
      const sx = Math.round(scx + rx);
      const sy = Math.round(scy + ry * sq);
      if (sx < -60 || sx > sceneW + 60 || sy < -60 || sy > sceneH + 60) continue;
      drawList.push({ kind: "star", obj: st, sx, sy, depth: ry });
    }

    const bdx = bunny.x - cam.x;
    const bdy = bunny.y - cam.y;
    const brx = bdx * cosA - bdy * sinA;
    const bry = bdx * sinA + bdy * cosA;
    const bsx = Math.round(scx + brx);
    const bsy = Math.round(scy + bry * sq);
    drawList.push({ kind: "bunny", obj: bunny, sx: bsx, sy: bsy, depth: bry });

    drawList.sort((a, b) => a.depth - b.depth);

    // 3. Ground contact shadows
    for (let i = 0; i < drawList.length; i++) {
      const item = drawList[i];
      let rx = 22, ry = 18 * sq;
      if (item.kind === "tree") { rx = 15; ry = 14 * sq; }
      else if (item.kind === "snowman") { rx = 11; ry = 10 * sq; }
      else if (item.kind === "star") { rx = 6; ry = 5 * sq; }
      else if (item.kind === "bunny") {
        const hopShrink = Math.max(0.65, 1 - bunny.hopZ * 0.02);
        rx = 15 * hopShrink;
        ry = 11 * sq * hopShrink;
      }
      sctx.fillStyle = item.kind === "bunny" ? "rgba(104, 62, 168, 0.22)" : "rgba(70, 108, 152, 0.22)";
      sctx.beginPath();
      sctx.ellipse(item.sx, item.sy + 3, rx, Math.max(3, ry), 0, 0, Math.PI * 2);
      sctx.fill();
    }

    // 4. Blit Y-sorted cached 3D sprite stacks (1 drawImage per object!)
    const speed = Math.hypot(bunny.vx, bunny.vy);
    const starSp = Math.min(1.5, settings.spacing);

    for (let i = 0; i < drawList.length; i++) {
      const item = drawList[i];
      const isOccludingInInspect =
        settings.mode === "inspect" &&
        item.kind !== "bunny" &&
        item.depth > bry - 6 &&
        Math.abs(item.sx - bsx) < 58;
      sctx.globalAlpha = isOccludingInInspect ? 0.22 : 1.0;

      if (item.kind === "tree") {
        const p = item.obj;
        const jitterX = p.shake > 0 ? Math.round(Math.sin(elapsed * 55) * p.shake * 3) : 0;
        const turn = p.angle + cam.angle - Math.PI * 0.5;
        const baked = getCachedStack("tree", imgs.treeSlices, window.SPRITE_META.treeSlices.count, turn, 24, "#0e383c");
        sctx.drawImage(baked.canvas, item.sx + jitterX - baked.cx, item.sy - baked.cy);
      } else if (item.kind === "snowman") {
        const p = item.obj;
        const turn = p.angle + cam.angle - Math.PI * 0.5;
        const baked = getCachedStack("snowman", imgs.snowmanSlices, window.SPRITE_META.snowmanSlices.count, turn, 48, "#181e34");
        sctx.drawImage(baked.canvas, item.sx - baked.cx, item.sy - baked.cy);
      } else if (item.kind === "star") {
        const st = item.obj;
        const bob = Math.round(7 + Math.sin(elapsed * 4.2 + st.phase) * 3.2);
        const turn = elapsed * 2.4 + st.phase + cam.angle;
        const baked = getCachedStack("star", imgs.starSlices, window.SPRITE_META.starSlices.count, turn, 24, "#92400e", starSp);
        sctx.drawImage(baked.canvas, item.sx - baked.cx, item.sy - baked.cy - bob);
      } else if (item.kind === "bunny") {
        const screenTurn = bunny.heading + cam.angle - Math.PI * 0.5;
        // 120-step angle cache (3° increments): crisp, rock-solid face + ~10x faster!
        const baked = getCachedStack("bunny", imgs.bunnySlices, window.SPRITE_META.bunnySlices.count, screenTurn, 120, "#521898");
        const wobbleY = speed > 30 && settings.mode === "play" ? Math.round(Math.sin(bunny.wobblePhase) * 1.4) : 0;
        const liftY = Math.round(bunny.hopZ) + wobbleY;
        sctx.drawImage(baked.canvas, item.sx - baked.cx, item.sy - baked.cy - liftY);

        if (settings.mode === "play" && (speed > 75 || bunny.boostTimer > 0)) {
          drawSlidingMotionArcs(sctx, item.sx, item.sy - Math.round(8 * settings.spacing) - liftY, bunny.heading + cam.angle, speed);
        }
      }
    }
    sctx.globalAlpha = 1.0;

    // 5. Render 3D snow/ice/star particles
    for (let i = 0; i < particles.length; i++) {
      const pt = particles[i];
      const dx = pt.x - cam.x;
      const dy = pt.y - cam.y;
      const rx = dx * cosA - dy * sinA;
      const ry = dx * sinA + dy * cosA;
      const px = Math.round(scx + rx);
      const py = Math.round(scy + ry * sq) - Math.round(pt.z);
      sctx.globalAlpha = Math.max(0, Math.min(1, pt.life / pt.maxLife));
      sctx.fillStyle = pt.color;
      sctx.fillRect(px, py, pt.size, pt.size);
    }
    sctx.globalAlpha = 1.0;

    // 6. Blit crisp nearest-neighbor scene to display canvas
    dctx.imageSmoothingEnabled = false;
    dctx.drawImage(sceneCanvas, 0, 0, displayCanvas.width, displayCanvas.height);
  }

  function drawSlidingMotionArcs(ctx, cx, cy, screenDirAng, speed) {
    const intensity = Math.min(1, (speed - 70) / 85);
    const fx = Math.cos(screenDirAng);
    const fy = Math.sin(screenDirAng) * settings.squash;
    const pulse = Math.sin(elapsed * 26) * 3;

    ctx.save();
    ctx.strokeStyle =
      bunny.boostTimer > 0
        ? `rgba(147, 59, 240, ${(0.55 + intensity * 0.35).toFixed(2)})`
        : `rgba(100, 116, 139, ${(intensity * 0.52).toFixed(2)})`;
    ctx.lineWidth = 1.5;

    for (const offset of [21 + pulse * 0.6, 26 + pulse * 0.6]) {
      ctx.beginPath();
      ctx.arc(Math.round(cx - fx * offset), Math.round(cy - fy * offset), 7, screenDirAng + Math.PI - 0.65, screenDirAng + Math.PI + 0.65);
      ctx.stroke();

      if (bunny.boostTimer > 0) {
        ctx.beginPath();
        ctx.arc(Math.round(cx + fx * offset), Math.round(cy + fy * offset), 7, screenDirAng - 0.55, screenDirAng + 0.55);
        ctx.stroke();
      }
    }
    ctx.restore();
  }

  // ---------------------------------------------------------------------------
  // HUD Updates & Controls Wiring
  // ---------------------------------------------------------------------------
  const starCountEl = document.getElementById("starCount");
  const surfaceBadgeEl = document.getElementById("surfaceBadge");
  const speedReadoutEl = document.getElementById("speedReadout");

  let hudTimer = 0;
  function updateHud(dt) {
    hudTimer += dt;
    if (hudTimer < 0.08) return;
    hudTimer = 0;

    starCountEl.textContent = String(bunny.starsCollected);
    speedReadoutEl.textContent = String(Math.round(Math.hypot(bunny.vx, bunny.vy)));

    if (bunny.onIce) {
      surfaceBadgeEl.textContent = "🧊 ICE SLIDE!";
      surfaceBadgeEl.classList.add("on-ice");
    } else {
      surfaceBadgeEl.textContent = "❄ SNOW";
      surfaceBadgeEl.classList.remove("on-ice");
    }
  }

  function wireUI() {
    const controlPanel = document.getElementById("controlPanel");
    document.getElementById("panelToggle").addEventListener("click", () => {
      controlPanel.classList.toggle("collapsed");
    });

    const modePlayBtn = document.getElementById("modePlayBtn");
    const modeInspectBtn = document.getElementById("modeInspectBtn");
    const zoomSlider = document.getElementById("zoomSlider");
    const zoomVal = document.getElementById("zoomVal");

    function setMode(m) {
      settings.mode = m;
      modePlayBtn.classList.toggle("active", m === "play");
      modeInspectBtn.classList.toggle("active", m === "inspect");
      if (m === "inspect") {
        cam.inspectAngle = bunny.heading;
        settings.zoom = Math.max(settings.zoom, 5);
        zoomSlider.value = String(settings.zoom);
        zoomVal.textContent = `${settings.zoom}x`;
        resize();
      } else {
        settings.zoom = 3;
        zoomSlider.value = "3";
        zoomVal.textContent = "3x";
        resize();
      }
    }

    modePlayBtn.addEventListener("click", () => setMode("play"));
    modeInspectBtn.addEventListener("click", () => setMode("inspect"));

    const squashSlider = document.getElementById("squashSlider");
    const squashVal = document.getElementById("squashVal");
    squashSlider.addEventListener("input", () => {
      settings.squash = parseFloat(squashSlider.value);
      squashVal.textContent = settings.squash.toFixed(2);
    });

    const spacingSlider = document.getElementById("spacingSlider");
    const spacingVal = document.getElementById("spacingVal");
    spacingSlider.addEventListener("input", () => {
      settings.spacing = parseFloat(spacingSlider.value);
      spacingVal.textContent = settings.spacing.toFixed(2);
    });

    zoomSlider.addEventListener("input", () => {
      settings.zoom = parseInt(zoomSlider.value, 10);
      zoomVal.textContent = `${settings.zoom}x`;
      resize();
    });

    const outlineToggle = document.getElementById("outlineToggle");
    outlineToggle.addEventListener("click", () => {
      settings.outline = !settings.outline;
      outlineToggle.textContent = `輪郭線: ${settings.outline ? "ON" : "OFF"}`;
      outlineToggle.classList.toggle("active", settings.outline);
    });

    const sfxToggle = document.getElementById("sfxToggle");
    sfxToggle.addEventListener("click", () => {
      settings.sfx = !settings.sfx;
      sfxToggle.textContent = `効果音: ${settings.sfx ? "ON" : "OFF"}`;
      sfxToggle.classList.toggle("active", settings.sfx);
    });

    document.getElementById("btnSpread").addEventListener("click", () => {
      settings.spacing = 2.5;
      spacingSlider.value = "2.5";
      spacingVal.textContent = "2.50";
    });

    document.getElementById("btnResetView").addEventListener("click", () => {
      settings.squash = 0.72;
      settings.spacing = 1.0;
      cam.angle = 0;
      squashSlider.value = "0.72";
      squashVal.textContent = "0.72";
      spacingSlider.value = "1.00";
      spacingVal.textContent = "1.00";
    });

    const sheetToggle = document.getElementById("sheetToggle");
    const sheetPreview = document.getElementById("sheetPreview");
    sheetToggle.addEventListener("click", () => {
      const open = sheetPreview.classList.toggle("open");
      sheetToggle.classList.toggle("active", open);
    });

    document.getElementById("boostBtn").addEventListener("click", triggerBoost);
  }

  // Expose lightweight render timing hook for diagnostics
  window.__perfStats = { frames: 0, totalRenderMs: 0 };

  let lastTs = 0;
  function loop(ts) {
    const dt = Math.min(0.05, lastTs ? (ts - lastTs) / 1000 : 1 / 60);
    lastTs = ts;
    update(dt);
    const t0 = performance.now();
    render();
    window.__perfStats.totalRenderMs += performance.now() - t0;
    window.__perfStats.frames++;
    updateHud(dt);
    requestAnimationFrame(loop);
  }

  window.addEventListener("resize", resize);
  wireUI();
  buildWorld();
  resize();

  loadAssets().then(() => {
    requestAnimationFrame(loop);
  });
})();

  </script>
</body>
</html>
